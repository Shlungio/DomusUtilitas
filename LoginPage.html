<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Domus Utilitas | Login</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>


<body
  class="min-h-screen bg-gray-900 text-gray-100"
  style="
    background-image: linear-gradient(
      rgba(3, 7, 18, 0.6),
      rgba(3, 7, 18, 0.6)
    ),
    url(https://cdn.pixabay.com/photo/2016/11/18/17/20/living-room-1835923_1280.jpg);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;">


  <!-- =========================
       HEADER
  ========================== -->
  <header class="border-b border-gray-800 bg-gray-950/95">

    <div
      class="mx-auto flex max-w-7xl items-center
             justify-between px-5 py-3"
    >

      <!-- LOGO / WEBSITE NAME -->
      <div class="flex items-center gap-3">

        <img
          src="logo.png"
          class="h-11 w-15 rounded-full object-contain"
          alt="DomusUtilitas"
        >

        <b >
          DomusUtilitas
        </b>

      </div>


      <!-- RIGHT SIDE NAVIGATION -->
      <div class="flex items-center gap-6" >

        <a
          href="HomePage.html"
          class="text-sm text-gray-300
                 transition hover:text-blue-400"
        >
          Home
        </a>

        <a
          href="RegisterPage.html"
          class="rounded-lg bg-blue-600
                 px-4 py-2 text-sm font-medium
                 transition hover:bg-blue-500"
        >
          Create Account
        </a>

      </div>

    </div>

  </header>



  <!-- =========================
       MAIN AREA
  ========================== -->
  <main
    class="mx-auto flex min-h-[calc(100vh-70px)]
           max-w-5xl items-center
           px-5 py-16"
  >


    <!-- =========================
         LOGIN CONTAINER
    ========================== -->
    <div
      class="grid w-full overflow-hidden
             rounded-2xl border border-gray-700
             bg-gray-800 shadow-2xl
             md:grid-cols-2"
    >


      <!-- =========================
           LEFT DESIGN SECTION
      ========================== -->
      <div
        class="relative flex flex-col justify-center
               overflow-hidden bg-gray-950 p-8
               md:p-12"
      >

        <div
          class="absolute inset-4
                 overflow-hidden rounded-xl"
        >

          <img
            id="background-image"
            src="webdecor1.jpg"
            alt=""
            class="h-full w-full object-cover object-center"
            style="transition: opacity 1s ease-in-out;"
          >

          <!-- DARK OVERLAY -->
          <div
            class="absolute inset-0 bg-gray-950/60"
          ></div>

        </div>


        <!-- CONTENT ON TOP -->
        <div class="relative z-10">

          <div class="mb-6">

            <img
              src="logo.png"
              class="h-15 w-15 rounded-full object-contain"
              alt="DomusUtilitas Logo"
            >

          </div>


          <h2
            class="mb-3 text-3xl font-bold
                   text-white"
          >
            Domus Utilitas
          </h2>


          <p
            class="max-w-sm leading-relaxed
                   text-gray-300"
          >
            Find useful products and essentials
            designed to make everyday living simpler.
          </p>

        </div>

      </div>



      <!-- =========================
           RIGHT LOGIN SECTION
      ========================== -->
      <div class="p-8 md:p-12">

        <!-- TITLE -->
        <h1
          class="mb-2 text-3xl font-bold"
        >
          Welcome Back
        </h1>


        <p
          class="mb-8 text-gray-400"
        >
          Log in to your DomusUtilitas account.
        </p>



        <!-- =========================
             LOGIN FORM
        ========================== -->
        <form
          id="login-form"
          class="flex flex-col gap-5"
        >


          <!-- USERNAME -->
          <div>

            <label
              for="username"
              class="mb-2 block text-sm
                     font-medium text-gray-300"
            >
              Username
            </label>


            <input
              id="username"
              type="text"
              autocomplete="username"
              placeholder="Enter your username"
              required

              class="w-full rounded-lg
                     border border-gray-700
                     bg-gray-900
                     px-4 py-3
                     text-gray-100
                     outline-none
                     transition
                     placeholder:text-gray-600
                     focus:border-blue-500
                     focus:ring-2
                     focus:ring-blue-500/20"
            >

          </div>



          <!-- PASSWORD -->
          <div>

            <label
              for="password"
              class="mb-2 block text-sm
                     font-medium text-gray-300"
            >
              Password
            </label>


            <input
              id="password"
              type="password"
              autocomplete="username"
              placeholder="Enter your password"
              required

              class="w-full rounded-lg
                     border border-gray-700
                     bg-gray-900
                     px-4 py-3
                     text-gray-100
                     outline-none
                     transition
                     placeholder:text-gray-600
                     focus:border-blue-500
                     focus:ring-2
                     focus:ring-blue-500/20"
            >

          </div>



          <!-- LOGIN MESSAGE -->
          <p
            id="login-message"
            class="hidden rounded-lg
                   border px-4 py-3
                   text-sm"
          ></p>



          <!-- LOGIN BUTTON -->
          <button
            id="login-button"
            type="submit"

            class="mt-2 rounded-lg
                   bg-blue-600 py-3
                   font-semibold
                   transition
                   hover:bg-blue-500
                   disabled:cursor-not-allowed
                   disabled:opacity-60"
          >
            Log In
          </button>


        </form>



        <!-- REGISTER -->
        <p
          class="mt-6 text-center
                 text-sm text-gray-400"
        >

          Don't have an account?

          <a
            href="RegisterPage.html"
            class="text-blue-400
                   hover:underline"
          >
            Register here
          </a>

        </p>


      </div>

    </div>

  </main>



<script>

const API = 'DomusUtilitas_api/';


// ==========================
// EXISTING SESSION CHECK
// ==========================

async function checkExistingSession() {

  try {

    const response =
      await fetch(
        API + 'auth/session.php',
        {
          credentials: 'include'
        }
      );


    const data =
      await response.json();


    if (
      !data.ok ||
      !data.logged_in
    ) {

      return;

    }


    // ADMIN
    if (data.user.role === 'admin') {

      window.location.href =
        'AdminProducts.html';

      return;

    }


    // CUSTOMER
    if (data.user.role === 'customer') {

      window.location.href =
        'ProductPage.html';

    }


  } catch (error) {

    console.error(
      'Session check failed:',
      error
    );

  }

}



// ==========================
// DISPLAY LOGIN MESSAGE
// ==========================

function showMessage(
  message,
  type = 'error'
) {

  const box =
    document.getElementById(
      'login-message'
    );


  box.textContent =
    message;


  box.className =
    'rounded-lg border px-4 py-3 text-sm';


  if (type === 'success') {

    box.classList.add(
      'border-green-700',
      'bg-green-950/50',
      'text-green-300'
    );

  } else {

    box.classList.add(
      'border-red-700',
      'bg-red-950/50',
      'text-red-300'
    );

  }

}



// ==========================
// LOGIN
// ==========================

document
  .getElementById('login-form')
  .addEventListener(
    'submit',
    async event => {

      event.preventDefault();


      const username =
        document
          .getElementById('username')
          .value
          .trim();


      const password =
        document
          .getElementById('password')
          .value;


      const button =
        document.getElementById(
          'login-button'
        );


      if (
        username === '' ||
        password === ''
      ) {

        showMessage(
          'Please enter your username and password.'
        );

        return;

      }


      try {

        button.disabled = true;
        button.textContent =
          'Logging in...';


        const response =
          await fetch(
            API + 'auth/login.php',
            {
              method: 'POST',

              credentials: 'include',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body: JSON.stringify({
                username: username,
                password: password
              })
            }
          );


        const data =
          await response.json();

            console.log('LOGIN RESPONSE:', data);

        if (!data.ok) {

          throw new Error(
            data.error ||
            'Login failed.'
          );

        }

        
        if (data.verification_required === true) {
          window.location.href = 'VerifyEmailPage.html';
          return;
        }


        showMessage(
          'Login successful.',
          'success'
        );


        // ADMIN
        if (data.user.role === 'admin') {

          window.location.href =
            'AdminProducts.html';

          return;

        }


        // CUSTOMER
        window.location.href =
          'ProductPage.html';


      } catch (error) {

        showMessage(
          error.message
        );


      } finally {

        button.disabled = false;
        button.textContent =
          'Log In';

      }

    }
  );



// ==========================
// IMAGE SLIDESHOW
// ==========================

const images = [

  "webdecor1.jpg",

  "webdecor2.jpg",

  "webdecor3.jpg"

];


let currentImage = 0;


const backgroundImage =
  document.getElementById(
    'background-image'
  );


setInterval(
  () => {

    // FADE OUT
    backgroundImage.classList.add(
      'opacity-0'
    );


    setTimeout(
      () => {

        // NEXT IMAGE
        currentImage++;


        if (
          currentImage >=
          images.length
        ) {

          currentImage = 0;

        }


        // CHANGE IMAGE
        backgroundImage.src =
          images[currentImage];


        // FADE BACK IN
        backgroundImage.classList.remove(
          'opacity-0'
        );

      },
      1000
    );

  },
  5000
);



// ==========================
// START PAGE
// ==========================

checkExistingSession();

</script>


</body>

</html>
