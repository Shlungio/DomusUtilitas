<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Domus Utilitas | Verify Email
  </title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>


<body
  class="min-h-screen bg-gray-900 text-gray-100"
>


<header
  class="border-b border-gray-800 bg-gray-950"
>

  <div
    class="mx-auto flex max-w-7xl items-center gap-3 px-5 py-3"
  >

    <img
      src="logo.png"
      alt="Domus Utilitas"
      class="h-11 w-15 rounded-full object-contain"
    >

    <b>
      Domus Utilitas
    </b>

  </div>

</header>


<main
  class="mx-auto flex max-w-md flex-col px-5 py-16"
>

  <div
    class="rounded-xl border border-gray-700 bg-gray-800 p-6"
  >

    <h1
      class="text-center text-3xl font-bold"
    >
      Verify Your Email
    </h1>


    <p
      class="mt-3 text-center text-sm text-gray-400"
    >
      We sent a 6-digit verification code
      to your registered email address.
    </p>


    <form
      id="verify-form"
      class="mt-7 space-y-4"
    >

      <div>

        <label
          for="otp"
          class="mb-1 block text-sm text-gray-300"
        >
          Verification Code
        </label>


        <input
          id="otp"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          pattern="[0-9]{6}"
          required
          placeholder="123456"
          class="w-full rounded border border-gray-700 bg-gray-900 px-4 py-3 text-center text-2xl tracking-[0.4em] outline-none focus:border-blue-500"
        >

      </div>


      <p
        id="status"
        class="hidden text-sm"
      ></p>


      <button
        id="verify-btn"
        type="submit"
        class="w-full rounded bg-blue-600 py-2 font-semibold hover:bg-blue-500 disabled:opacity-50"
      >
        Verify Email
      </button>


      <button
        id="resend-btn"
        type="button"
        class="w-full rounded bg-gray-700 py-2 text-sm hover:bg-gray-600 disabled:opacity-50"
      >
        Resend Code
      </button>

    </form>

  </div>

</main>



<script>

const API =
  'DomusUtilitas_api/';


const form =
  document.getElementById(
    'verify-form'
  );


const otpInput =
  document.getElementById(
    'otp'
  );


const verifyButton =
  document.getElementById(
    'verify-btn'
  );


const resendButton =
  document.getElementById(
    'resend-btn'
  );


const statusEl =
  document.getElementById(
    'status'
  );

let resendTimer = null;


// ==========================
// STATUS MESSAGE
// ==========================

function showStatus(
  message,
  success = false
) {

  statusEl.textContent =
    message;


  statusEl.className =
    success
      ? 'text-sm text-green-400'
      : 'text-sm text-red-400';

}


// ==========================
// RESEND COUNTDOWN
// ==========================

function startResendCountdown(
  seconds
) {

  clearInterval(
    resendTimer
  );


  let remaining =
    seconds;


  resendButton.disabled =
    true;


  resendButton.textContent =
    `Resend Code (${remaining}s)`;


  resendTimer =
    setInterval(
      () => {

        remaining--;


        if (remaining <= 0) {

          clearInterval(
            resendTimer
          );

          resendButton.disabled =
            false;

          resendButton.textContent =
            'Resend Code';

          return;

        }


        resendButton.textContent =
          `Resend Code (${remaining}s)`;

      },
      1000
    );

}

// ==========================
// SEND OTP
// ==========================

async function sendCode() {

  resendButton.disabled =
    true;


  resendButton.textContent =
    'Sending...';


  try {

    const response =
      await fetch(
        API +
        'auth/send_email_otp.php',
        {
          method: 'POST',
          credentials: 'include'
        }
      );


    const data =
      await response.json();


    // Server says cooldown
    // is still active.
    if (!data.ok) {

      showStatus(
        data.error ||
        'Unable to send verification code.'
      );


      if (data.retry_after) {

        startResendCountdown(
          data.retry_after
        );

      } else {

        resendButton.disabled =
          false;

        resendButton.textContent =
          'Resend Code';

      }


      return;

    }


    showStatus(
      'Verification code sent. Check your email.',
      true
    );


    startResendCountdown(
      data.resend_after || 15
    );


  } catch (error) {

    showStatus(
      'Unable to send verification code.'
    );


    resendButton.disabled =
      false;

    resendButton.textContent =
      'Resend Code';

  }

}



// ==========================
// VERIFY OTP
// ==========================

form.addEventListener(
  'submit',
  async event => {

    event.preventDefault();


    const otp =
      otpInput.value
        .trim();


    if (!/^\d{6}$/.test(otp)) {

      showStatus(
        'Enter the complete 6-digit code.'
      );

      return;

    }


    verifyButton.disabled =
      true;

    verifyButton.textContent =
      'Verifying...';


    try {

      const response =
        await fetch(
          API +
          'auth/verify_email_otp.php',
          {

            method: 'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            credentials:
              'include',

            body:
              JSON.stringify({
                otp: otp
              })

          }
        );


      const data =
        await response.json();


      if (!data.ok) {

        throw new Error(
          data.error ||
          'Unable to verify email.'
        );

      }


      showStatus(
        'Email verified successfully.',
        true
      );


      setTimeout(
        () => {

          window.location.href =
            data.redirect ||
            'ProductPage.html';

        },
        700
      );


    } catch (error) {

      showStatus(
        error.message
      );


    } finally {

      verifyButton.disabled =
        false;

      verifyButton.textContent =
        'Verify Email';

    }

  }
);



// ==========================
// RESEND
// ==========================

resendButton.addEventListener(
  'click',
  sendCode
);



// ==========================
// INITIAL CODE
// ==========================

// A newly registered customer arrives here
// with a pending verification session.
// Automatically send their first code.

sendCode();

</script>


</body>

</html>
